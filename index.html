<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alat Perapih File CSV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #E2572B; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        .upload-area { border: 2px dashed #ccc; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; background-color: #fafafa; }
        input[type="file"] { margin-top: 10px; }
        button { background-color: #E2572B; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-right: 10px; transition: background 0.3s; }
        button:hover { background-color: #c44b25; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-weight: bold; color: #2c3e50; }
        .note { font-size: 13px; color: #7f8c8d; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Alat Perapih File CSV (Offline)</h2>
    <p>Upload file CSV yang rusak atau mentah, lalu download hasilnya dalam format Excel yang sudah bersih.</p>

    <div class="form-group">
        <label for="fileType">Pilih Jenis Data:</label>
        <select id="fileType">
            <option value="bukpot">Bukti Potong Pajak (BPU/BPUP)</option>
            <option value="mileapp">Data Resi Mile App (POD)</option>
        </select>
    </div>

    <div class="upload-area">
        <input type="file" id="fileInput" accept=".csv" multiple>
        <div class="note">*Anda bisa memilih banyak file sekaligus dengan menahan tombol Ctrl/Shift.</div>
    </div>

    <div>
        <button id="processBtn" onclick="processFiles()">Proses Data</button>
        <button id="downloadBtn" onclick="downloadExcel()" style="display:none; background-color: #27ae60;">Download Excel</button>
    </div>

    <div id="status"></div>
</div>

<script>
    let finalData = [];
    let fileTypeGlobal = 'bukpot';

    async function processFiles() {
        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        fileTypeGlobal = document.getElementById('fileType').value;

        if (fileInput.files.length === 0) {
            alert("Silakan pilih file CSV terlebih dahulu.");
            return;
        }

        processBtn.disabled = true;
        statusDiv.innerHTML = "Memproses " + fileInput.files.length + " file...";
        finalData = [];

        for (let i = 0; i < fileInput.files.length; i++) {
            const file = fileInput.files[i];
            const text = await readFileAsText(file);
            
            if (fileTypeGlobal === 'bukpot') {
                finalData = finalData.concat(processBukpot(text));
            } else if (fileTypeGlobal === 'mileapp') {
                finalData = finalData.concat(processMileApp(text));
            }
        }

        // Pengurutan
        if (fileTypeGlobal === 'bukpot') {
            finalData.sort((a, b) => new Date(a['Tanggal Bukti Potong']) - new Date(b['Tanggal Bukti Potong']));
        } else if (fileTypeGlobal === 'mileapp') {
            finalData.sort((a, b) => new Date(a['Tgl Kirim']) - new Date(b['Tgl Kirim']));
        }

        statusDiv.innerHTML = "Selesai! " + finalData.length + " baris data berhasil dirapikan.";
        processBtn.disabled = false;
        downloadBtn.style.display = "inline-block";
    }

    function readFileAsText(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = e => reject(e);
            reader.readAsText(file);
        });
    }

    // Fungsi untuk memproses Bukti Potong
    function processBukpot(rawText) {
        let lines = rawText.split('\n');
        let cleanedCsvText = "";

        for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            if (line.includes(';;')) line = line.split(';;')[0];
            line = line.replace(/;+$/, ''); 
            cleanedCsvText += line + "\n";
        }

        let parsed = Papa.parse(cleanedCsvText, { header: true, skipEmptyLines: true, quoteChar: '"' });
        let formatted = [];

        parsed.data.forEach(row => {
            let npwp = row.npwp_pemotong || row.lawan_transaksi || "";
            let nama = row.nama_penerima_ph || row.nama_lt || "";
            if(nama === "" && npwp !== "") nama = "PEMOTONG PAJAK (NPWP: " + npwp + ")";

            let cleanRow = {
                "ID": row.id || "",
                "Nomor Bukti Potong": row.nomor_bupot || "",
                "Tanggal Bukti Potong": row.tgl_bupot || "",
                "Masa Pajak": (row.masa_pajak || "").replace(/\.0$/, ""),
                "Status": row.status_bupot || "",
                "NPWP/TIN Lawan Transaksi": npwp.replace(/\.0$/, ""),
                "Nama Lawan Transaksi": nama,
                "Kode Objek Pajak": row.kop || "",
                "DPP Bruto": parseFloat(row.dpp_bruto) || 0,
                "PPh Dipotong": parseFloat(row.pph) || 0,
                "Dokumen Dasar": row.doc_dp || "",
                "Nomor Dokumen": row.no_doc_dp || ""
            };
            
            if (row.nitku_pemotong) cleanRow["Keterangan Tambahan"] = "NITKU: " + row.nitku_pemotong;
            else if (row.dilaporkan_di_spt) cleanRow["Keterangan Tambahan"] = "Dilaporkan di SPT: " + row.dilaporkan_di_spt;
            else cleanRow["Keterangan Tambahan"] = "";

            if(cleanRow["ID"] !== "" && cleanRow["Nomor Bukti Potong"] !== "nomor_bupot") formatted.push(cleanRow);
        });
        return formatted;
    }

    // Fungsi untuk memproses Data Mile App
    function processMileApp(rawText) {
        // Parse CSV khusus Mile App (menggunakan pemisah ;)
        let parsed = Papa.parse(rawText, {
            header: true,
            skipEmptyLines: true,
            delimiter: ";"
        });

        let formatted = [];
        
        parsed.data.forEach(row => {
            // Bersihkan koma dari nilai uang agar bisa jadi angka Excel
            let ongkirClean = (row["Ongkir"] || "0").replace(/,/g, '');
            let totalBeaClean = (row["Total Bea"] || "0").replace(/,/g, '');
            let ppnClean = (row["PPN"] || "0").replace(/,/g, '');
            
            // Format data
            let cleanRow = {
                "No Resi": row["No Resi"] || "",
                "Layanan": row["Layanan"] || "",
                "Nama Pengirim": row["Nama Pengirim"] || "",
                "Penerima": row["Penerima"] || "",
                "No HP": row["No HP"] || "",
                "Kota Tujuan": row["Kota"] || "",
                "Berat": parseFloat(row["Berat"]) || 0,
                "Ongkir": parseFloat(ongkirClean) || 0,
                "PPN": parseFloat(ppnClean) || 0,
                "Total Bea": parseFloat(totalBeaClean) || 0,
                "Tgl Kirim": row["Tgl Kirim"] || "",
                "Status": row["Status"] || "",
                "Kiriman Diterima Oleh": row["Kiriman Diterima Oleh"] || "",
                "Tgl Update": row["Tgl Update"] || "",
                "Petugas": row["Petugas  Eintri"] || ""
            };
            
            // Masukkan data valid (cek header)
            if(cleanRow["No Resi"] !== "" && cleanRow["No Resi"] !== "No Resi") {
                formatted.push(cleanRow);
            }
        });
        
        return formatted;
    }

    function downloadExcel() {
        if (finalData.length === 0) return;

        const ws = XLSX.utils.json_to_sheet(finalData);
        const wb = XLSX.utils.book_new();
        
        let sheetName = fileTypeGlobal === 'bukpot' ? "Bukti_Potong" : "Data_Resi_MileApp";
        XLSX.utils.book_append_sheet(wb, ws, sheetName);

        let fileName = fileTypeGlobal === 'bukpot' ? "Rekap_Bukti_Potong_Rapih.xlsx" : "Rekap_MileApp_Rapih.xlsx";
        XLSX.writeFile(wb, fileName);
    }
</script>

</body>
</html>
