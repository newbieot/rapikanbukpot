<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PosIND - Perapih Bukti Potong</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 40px; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; border-top: 6px solid #1C2D5A; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #1C2D5A; }
        .accent { color: #EF4123; }
        .upload-area { border: 2px dashed #1C2D5A; padding: 30px; text-align: center; border-radius: 8px; margin: 20px 0; background: #fafafa; }
        button { background-color: #EF4123; color: white; border: none; padding: 12px 25px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #d1371c; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Alat Perapih <span class="accent">Bukti Potong</span></h2>
        <p>Gabungkan dan rapikan file CSV BPU/BPUP ke format Excel standar PosIND.</p>
        <div class="upload-area">
            <input type="file" id="fileInput" accept=".csv" multiple>
        </div>
        <button onclick="processFiles()">Proses & Download Excel</button>
        <div id="status"></div>
    </div>

<script>
    let finalData = [];

    async function processFiles() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) return alert("Pilih file dulu!");
        
        finalData = [];
        for (let file of fileInput.files) {
            const text = await file.text();
            finalData = finalData.concat(parseBukpot(text));
        }

        finalData.sort((a, b) => new Date(a['Tanggal Bukti Potong']) - new Date(b['Tanggal Bukti Potong']));
        exportToExcel();
    }

    function parseBukpot(rawText) {
        let cleaned = rawText.split('\n').map(l => l.trim()).filter(l => l && !l.includes(';;')).join('\n');
        let parsed = Papa.parse(cleaned, { header: true, skipEmptyLines: true });
        return parsed.data.map(row => {
            let npwp = (row.npwp_pemotong || row.lawan_transaksi || "").replace(/\.0$/, "");
            return {
                "ID": row.id || "",
                "Nomor Bukti Potong": row.nomor_bupot || "",
                "Tanggal Bukti Potong": row.tgl_bupot || "",
                "Masa Pajak": (row.masa_pajak || "").replace(/\.0$/, ""),
                "Status": row.status_bupot || "",
                "NPWP/TIN Lawan": npwp,
                "Nama Lawan Transaksi": row.nama_penerima_ph || row.nama_lt || ("NPWP: " + npwp),
                "Kode Objek Pajak": row.kop || "",
                "DPP Bruto": parseFloat(row.dpp_bruto) || 0,
                "PPh Dipotong": parseFloat(row.pph) || 0,
                "Dokumen Dasar": row.doc_dp || "",
                "Nomor Dokumen": row.no_doc_dp || ""
            };
        });
    }

    function exportToExcel() {
        const ws = XLSX.utils.json_to_sheet(finalData);
        const range = XLSX.utils.decode_range(ws['!ref']);
        
        // Auto-width logic
        let colWidths = Object.keys(finalData[0]).map(key => ({ wch: Math.max(key.length + 5, 15) }));
        finalData.forEach(row => {
            Object.values(row).forEach((val, i) => {
                let len = val ? val.toString().length : 0;
                if (len > colWidths[i].wch) colWidths[i].wch = Math.min(len + 2, 50);
            });
        });
        ws['!cols'] = colWidths;

        // Styling
        for (let R = range.s.r; R <= range.e.r; ++R) {
            for (let C = range.s.c; C <= range.e.c; ++C) {
                let cell = ws[XLSX.utils.encode_cell({r:R, c:C})];
                if(!cell) continue;
                cell.s = { font: { name: "Arial", sz: 11 } };
                if (R === 0) {
                    cell.s = { fill: { fgColor: { rgb: "1C2D5A" } }, font: { bold: true, color: { rgb: "FFFFFF" } }, alignment: { horizontal: "center" } };
                } else if (cell.t === 'n') {
                    cell.z = "#,##0";
                }
            }
        }

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Bukti Potong");
        XLSX.writeFile(wb, "Rekap_Bukpot_PosIND.xlsx");
    }
</script>
</body>
</html>
